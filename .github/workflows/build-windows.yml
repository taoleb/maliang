name: Build Windows installer (maliang)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "desktop/**"
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build Python backend
        shell: pwsh
        run: |
          python -m venv desktop/build/.venv-build
          .\desktop\build\.venv-build\Scripts\pip install -U pip
          .\desktop\build\.venv-build\Scripts\pip install -r desktop/build/requirements-desktop.txt
          .\desktop\build\.venv-build\Scripts\pip install pyinstaller
          .\desktop\build\.venv-build\Scripts\pyinstaller desktop/build/maliang-backend.spec --noconfirm --distpath desktop/build/dist --workpath desktop/build/build-work

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Package NSIS installer
        working-directory: desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # Invoke electron-builder through node, not npm/npx. npm and npx treat
        # --config as their own flag, and the previous npx call returned in
        # under a second with no packager output and no .exe.
        # Unsigned build is expected unless signing secrets are provided.
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed: $LASTEXITCODE" }

          if (-not (Test-Path resources/bin)) {
            New-Item -ItemType Directory -Path resources/bin | Out-Null
          }

          $cli = Join-Path $PWD "node_modules/electron-builder/cli.js"
          if (-not (Test-Path $cli)) {
            Write-Host "node_modules/.bin contents:"
            if (Test-Path "node_modules/.bin") {
              Get-ChildItem "node_modules/.bin" | ForEach-Object { Write-Host $_.Name }
            }
            throw "electron-builder CLI not found at $cli"
          }

          Write-Host "Running electron-builder via $cli"
          & node $cli --win --x64 --config electron-builder.win.js --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder exited with code $LASTEXITCODE" }

          Write-Host "Release directory:"
          if (Test-Path release) {
            Get-ChildItem -Recurse release | ForEach-Object { Write-Host ("{0}  {1}" -f $_.Length, $_.FullName) }
          } else {
            Write-Host "(release/ does not exist)"
          }
          $exes = @(Get-ChildItem -Path release -Filter *.exe -Recurse -ErrorAction SilentlyContinue)
          if ($exes.Count -eq 0) {
            throw "electron-builder finished but no .exe was found under desktop/release"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: maliang-windows-x64
          path: desktop/release/*-Setup-*.exe
          if-no-files-found: error
